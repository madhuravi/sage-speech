<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #202124;
        --muted: #5f6368;
        --accent: #1a73e8;
        --border: #dadce0;
        --field: #f1f3f4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --accent: #8ab4f8;
          --border: #3c4043;
          --field: #303134;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, Arial, sans-serif;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 14px;
        min-height: 16px;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-bottom: 16px;
      }
      button {
        font: inherit;
        padding: 8px 6px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--field);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        grid-column: 1 / -1;
        background: var(--accent);
        color: #fff;
        border: none;
        font-weight: 600;
        padding: 10px;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 12px 0 4px;
      }
      select, input[type="range"] {
        width: 100%;
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .row output { font-size: 12px; color: var(--muted); min-width: 30px; text-align: right; }
      .hint { font-size: 11px; color: var(--muted); margin-top: 14px; }
    </style>
  </head>
  <body>
    <h1>🔊 Sage Speech</h1>
    <div class="status" id="status">Checking page…</div>

    <div class="controls">
      <button class="primary" id="play">▶ Listen</button>
      <button id="pause">⏸ Pause</button>
      <button id="resume">▶ Resume</button>
      <button id="stop">⏹ Stop</button>
    </div>

    <label for="voice">Voice</label>
    <select id="voice"></select>

    <label for="rate">Speed <span id="rateVal">1.0×</span></label>
    <div class="row">
      <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" />
    </div>

    <label for="pitch">Pitch <span id="pitchVal">1.0</span></label>
    <div class="row">
      <input type="range" id="pitch" min="0" max="2" step="0.1" value="1" />
    </div>

    <div class="hint" id="hint">
      Open a search that shows an AI summary at the top, then press Listen.
    </div>
    <div class="hint" style="margin-top: 10px; opacity: 0.8;">
      Runs entirely on your device — no data leaves your browser.
      Not affiliated with or endorsed by Google.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
